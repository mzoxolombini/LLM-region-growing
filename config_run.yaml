# Configuration actually used for the reported run (see paper, Section 4).
seed: 0
data_dir: data
cache_dir: cache
run_dir: runs/main
scenes: [indian_pines, pavia_university, salinas, botswana, houston]
train_frac: 0.70
inner_frac: 0.75
seed_design: designs/d0_baseline_mrg.py
llm:
  provider: manual            # operator mode: Claude Opus 5.5 answered each prompt file
  model: claude-opus-5-5
  temperature: null
search: {mu: 4, lambda: 4, generations: 2}
harness: {timeout_s: 900, parallel_scenes: 2, threads_per_job: 1, group_holdout_frac: 0.25, max_vote_pixels: 200}
select: {strict_growth_rule: true}
final:
  split_seeds: [0, 1, 2]
  spatial_tile: 16
  spatial_seeds: [0]
  fs_split_seeds: [0]          # MRG-PSO / MRG-ASVM on split 0 only (time budget)
  workers: 2
  feature_selection: {n_particles: 6, iters: 5, alpha: 0.99, folds: 3}
  doe: true
  doe_budget: 4
